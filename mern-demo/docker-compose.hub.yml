services:
  backend:
    image: hungtranthien/mern-backend:1.0
    container_name: mern-backend-container
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    image: hungtranthien/mern-frontend:2.0
    container_name: mern-frontend-container
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
